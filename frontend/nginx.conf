server {
    listen 3000;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else (index.html, config.js) must revalidate so a new release
    # or a changed AICONTROL_API_URL takes effect on the next load.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin route to the API: set AICONTROL_API_URL=/api and the browser
    # never makes a cross-origin call (no CORS_ORIGINS change needed).
    location /api/ {
        proxy_pass http://api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
