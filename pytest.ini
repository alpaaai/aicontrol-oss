[pytest]
asyncio_mode = auto
asyncio_default_test_loop_scope = session
testpaths = tests
markers =
    live_llm: hits the real LLM provider; requires a key; excluded from the default run
    live_server: needs a running API at AICONTROL_TEST_BASE_URL (localhost:8001); excluded in CI
addopts = -m "not live_llm"

