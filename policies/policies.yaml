# Seed policies, v3 scope model.
#
# Every policy compiles to a Cedar `forbid` carrying its own scope:
#   principal_type / principal_id  -- which agent, or which group. NULL means
#                                     "every agent" (see get_scoped_policies).
#   action_tool                    -- which tool. NULL means "any tool".
#   resource_system                -- which system. NULL means "any system".
#   effect                         -- "deny" or "review". There is no "allow":
#                                     the catch-all permit is supplied by
#                                     cedar_client, not by a policy row.
#
# `rule_type` and `action` are gone. The presence of a key in `condition` is the
# dispatch now, which is why the rule_type column drops in this task.
#
# The former `allow_standard_tools` default_allow policy is deliberately absent:
# it is exactly the catch-all permit cedar_client appends to every bundle, so
# keeping it as a row would duplicate the engine's own fallback.

policies:
  - name: block_dangerous_tools
    description: "Block globally dangerous tools regardless of parameters"
    principal_type: null
    principal_id: null
    action_tool: null
    resource_system: null
    effect: deny
    condition:
      tool_name_in:
        - execute_code
        - delete_database
        - drop_table
        - shell_exec
        - rm_rf
    active: true
    severity: critical
    compliance_frameworks: ["SOC2"]

  - name: require_review_for_external_calls
    description: Flag any tool that makes external HTTP requests for human review
    principal_type: null
    principal_id: null
    action_tool: null
    resource_system: null
    effect: review
    condition:
      tool_name_contains: ["http_request", "webhook", "external_api"]
    active: true
    severity: high
    compliance_frameworks: ["SOC2"]

  - name: block_unapproved_outbound_http
    description: "Block outbound HTTP POST/request calls to unapproved external destinations"
    principal_type: null
    principal_id: null
    action_tool: null
    resource_system: null
    effect: deny
    condition:
      tool_name_in:
        - http_post
        - http_request
    active: true
    severity: critical
    compliance_frameworks: ["SOC2", "ISO27001"]

  # ── Example policies (inactive — activate per customer) ────────────────────

  - name: example_high_value_loan_review
    description: "Flag loan approvals over $500k for human review — lending example"
    principal_type: null
    principal_id: null
    action_tool: approve_loan
    resource_system: null
    effect: review
    condition:
      numeric_conditions:
        loan_amount:
          gt: 500000
    severity: high
    compliance_frameworks: ["SOC2", "GLBA"]
    active: false

  - name: example_bulk_revenue_export_deny
    description: "Deny unscoped account queries requesting revenue fields — RevOps example"
    principal_type: null
    principal_id: null
    action_tool: query_all_accounts
    resource_system: null
    effect: deny
    condition:
      all_of:
        - parameter_match:
            filter: "null"
        - numeric_conditions:
            limit:
              gte: 1000
    severity: critical
    compliance_frameworks: ["GDPR", "SOC2"]
    active: false

  - name: example_no_weekend_production_changes
    description: "Block production changes on weekends — ITSM example"
    principal_type: null
    principal_id: null
    action_tool: null
    resource_system: null
    effect: deny
    condition:
      all_of:
        - tool_name_in: [deploy_to_production, restart_service, apply_config_patch]
        - time_conditions:
            deny_days: [5, 6]
    severity: high
    compliance_frameworks: ["SOC2"]
    active: false

  - name: example_phi_access_all_variants
    description: "Block PHI access outside encounter cohort — covers all tool name variants"
    principal_type: null
    principal_id: null
    action_tool: null
    resource_system: null
    effect: deny
    condition:
      all_of:
        # tool_aliases folded into the exact-match list: base.rego matched the
        # primary name and every alias exactly, so tool_name_in preserves it.
        - tool_name_in:
            - read_patient_record
            - queryPatientRecord
            - get_patient_data
            - fetch_patient_record
            - getPatientRecord
        - parameter_match:
            patient_id: "PT-2024-09*"
    severity: critical
    compliance_frameworks: ["HIPAA"]
    active: false

  - name: example_rate_limit_sensitive_reads
    description: "Cap repeated calls to a sensitive read tool within a session — rate-limiting example"
    principal_type: null
    principal_id: null
    action_tool: read_record
    resource_system: null
    effect: review
    condition:
      rate_limit:
        max_calls: 20
        window: session
    severity: medium
    compliance_frameworks: ["SOC2"]
    active: false
