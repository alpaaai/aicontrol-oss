policies:
  - name: deny_cross_encounter_phi_access
    description: The care coordinator may fetch encounters only for its assigned patient, not others referenced by a shared care-plan record.
    principal_type: agent
    principal_id: care-coordinator
    action_tool: fetch_encounter
    resource_system: epic
    effect: deny
    condition:
      parameter_match:
        patient_id: "PT-2024-098*"
    severity: critical
    active: true
    compliance_frameworks: ["hipaa", "soc2"]
