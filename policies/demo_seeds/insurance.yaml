policies:
  - name: review_high_value_claim_payment
    description: A settlement above the adjuster's authority limit needs a human.
    principal_type: agent
    principal_id: claims-adjuster
    action_tool: release_payment
    resource_system: guidewire
    effect: review
    condition:
      numeric_conditions:
        amount:
          gt: 50000
    severity: high
    active: true
    compliance_frameworks: ["soc2"]

  - name: deny_unscoped_claims_query
    description: The adjuster may query only the claim it is assigned to.
    principal_type: agent
    principal_id: claims-adjuster
    action_tool: db_query
    resource_system: guidewire
    effect: deny
    condition:
      numeric_conditions:
        row_limit:
          gt: 1
    severity: critical
    active: true
    compliance_frameworks: ["soc2", "iso_42001"]
